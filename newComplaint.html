<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>New Complaint — CityWatch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="page-newComplaint">

<!-- Navigation Bar -->
<nav class="nav">
  <div class="container nav-inner">
    <div class="logo">CityWatch</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="login.html">Register</a></li>
    </ul>
  </div>
</nav>

<!-- New Complaint Form: required fields validated in js/script.js -->
<main class="container auth-card">
  <h2>Submit New Complaint</h2>
  <form id="complaintForm" class="form" novalidate>
    <label for="title">Complaint Title</label>
    <input type="text" id="title" name="title" placeholder="e.g., Potholes on Main St" required>

    <label for="department">Department</label>
    <select id="department" name="department" required>
      <option value="">Loading departments...</option>
    </select>

    <label for="category">Category</label>
    <input type="text" id="category" name="category" placeholder="e.g., Road maintenance" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="5" placeholder="Describe the problem" required></textarea>

    <fieldset>
      <legend>Complaint Location</legend>
      <label for="areaName">Area</label>
      <input type="text" id="areaName" name="areaName" required>
      <label for="city">City</label>
      <input type="text" id="city" name="city" required>
      <label for="district">District</label>
      <input type="text" id="district" name="district" required>
      <label for="pincode">Pincode</label>
      <input type="text" id="pincode" name="pincode" maxlength="10" required>
    </fieldset>

    <label for="image">Upload Image (Optional)</label>
    <input type="file" id="image" name="image" accept="image/*">

    <button class="btn primary" type="submit">Submit Complaint</button>
  </form>
</main>

<script src="js/script.js"></script>
</body>
</html>
