<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard — CityWatch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="page-dashboard">

<!-- Navigation Bar -->
<nav class="nav">
  <div class="container nav-inner">
    <div class="logo">CityWatch</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="login.html">Register</a></li>
    </ul>
  </div>
</nav>

<!-- Dashboard Header: welcome message and quick stats -->
<main class="container dashboard">
  <section class="welcome">
    <h2>Welcome,</h2>
    <h1>Muhammad Abdullah</h1>
  </section>

  <!-- Statistics Cards: totals derived from complaint data -->
  <section class="stats-grid" id="statsGrid">
    <!-- Filled by JS: Total Complaints, Pending, In Progress, Resolved -->
  </section>

  <!-- Quick Actions -->
  <div class="actions">
    <a class="btn primary" href="newComplaint.html">New Complaint</a>
    <a class="btn outline" href="history.html">Complaint History</a>
    <a class="btn danger" href="index.html">Logout</a>
  </div>

  <!-- Recent Complaints Table: populated using JS dummy data -->
  <section class="card recent">
    <h3>Recent Complaints</h3>
    <div class="table-wrap">
      <table id="recentTable" class="table">
        <thead>
          <tr>
            <th>Complaint ID</th>
            <th>Title</th>
            <th>Department</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          <!-- JS populates rows -->
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="js/script.js"></script>
</body>
</html>
