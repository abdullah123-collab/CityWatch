<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Complaint History — CityWatch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="page-history">

<!-- Navigation Bar -->
<nav class="nav">
  <div class="container nav-inner">
    <div class="logo">CityWatch</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="login.html">Register</a></li>
    </ul>
  </div>
</nav>

<!-- Complaint History Table: shows all complaints with colored status badges -->
<main class="container">
  <section class="card">
    <div class="section-heading">
      <div>
        <p class="eyebrow">Your reports</p>
        <h2>Complaint History</h2>
      </div>
      <a class="btn primary" href="newComplaint.html">New complaint</a>
    </div>
    <div class="filters" aria-label="Complaint filters">
      <label>Search <input id="historySearch" type="search" placeholder="Search title or description"></label>
      <label>Status
        <select id="historyStatus">
          <option value="">All statuses</option>
          <option>Pending</option>
          <option>In Progress</option>
          <option>Resolved</option>
          <option>Rejected</option>
        </select>
      </label>
      <label>Priority
        <select id="historyPriority">
          <option value="">All priorities</option>
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
          <option>Critical</option>
        </select>
      </label>
      <label>Order
        <select id="historySort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </label>
    </div>
    <div id="historyMessage" class="message" role="status"></div>
    <div class="table-wrap">
      <table id="historyTable" class="table">
        <thead>
          <tr>
            <th>Complaint ID</th>
            <th>Title</th>
            <th>Department</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Date</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody>
          <!-- Populated by JS -->
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="js/script.js"></script>
</body>
</html>
